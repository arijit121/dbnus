# Gradle memory configuration
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED

# Android configuration
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false

# Flutter Gradle migration settings
android.builtInKotlin=false
android.newDsl=false

# Gradle performance and memory management
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.daemon=true